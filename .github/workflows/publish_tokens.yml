name: Publish generated tokens

# Runs `node build.js` and opens a PR in each consumer repo
# (polkadot-app-design-system-ios, polkadot-app-design-system-android) with
# the freshly regenerated platform output. Triggers on source/generator
# changes that land on main; can also be dispatched manually.
#
# Required repo secret: TOKENS_PUBLISH_PAT — a PAT (classic or fine-grained)
# with `repo` scope on both consumer repos so the workflow can push branches
# and open PRs there. The default GITHUB_TOKEN is repo-scoped and won't work
# for cross-repo writes.

on:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - 'platforms/**'
      - 'lib/**'
      - 'build.js'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

# Cancel in-flight runs on the same branch when a new push lands — only the
# latest source should drive an open PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Generate platform output
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate
        run: node build.js

      - name: Upload iOS output
        uses: actions/upload-artifact@v4
        with:
          name: ios-generated
          path: out/ios/
          retention-days: 1
          if-no-files-found: error

      - name: Upload Android output
        uses: actions/upload-artifact@v4
        with:
          name: android-generated
          path: out/android/
          retention-days: 1
          if-no-files-found: error

  publish-ios:
    name: Open PR in polkadot-app-design-system-ios
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: novasamatech/polkadot-app-design-system-ios
          token: ${{ secrets.TOKENS_PUBLISH_PAT }}
          path: target

      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-generated
          path: ios-out

      # rsync without --delete: overlay generated output onto Generated/, leaving
      # hand-written files alongside (e.g. PolkadotLightTheme.swift stub for which
      # no Figma source exists). Reviewers handle orphan cleanup on rename events.
      - name: Sync generated files
        run: |
          mkdir -p target/Sources/DesignSystem/Generated
          rsync -a ios-out/ target/Sources/DesignSystem/Generated/

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          path: target
          token: ${{ secrets.TOKENS_PUBLISH_PAT }}
          branch: tokens/sync-${{ github.sha }}
          delete-branch: true
          commit-message: |
            Sync generated tokens from polkadot-app-design-system@${{ github.sha }}
          title: 'Sync generated tokens'
          body: |
            Regenerated from upstream [polkadot-app-design-system](https://github.com/${{ github.repository }}) at [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}).

            Files under `Sources/DesignSystem/Generated/` are produced by `node build.js` in the upstream repo. Do not hand-edit — push to upstream `main` to regenerate.
          reviewers: svojsu

  publish-android:
    name: Open PR in polkadot-app-design-system-android
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: novasamatech/polkadot-app-design-system-android
          token: ${{ secrets.TOKENS_PUBLISH_PAT }}
          path: target

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-generated
          path: android-out

      - name: Sync generated files
        run: |
          DEST=target/design-system/src/main/java/io/pcf/polkadotapp/designsystem
          mkdir -p "$DEST"
          rsync -a android-out/ "$DEST"/

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          path: target
          token: ${{ secrets.TOKENS_PUBLISH_PAT }}
          branch: tokens/sync-${{ github.sha }}
          delete-branch: true
          commit-message: |
            Sync generated tokens from polkadot-app-design-system@${{ github.sha }}
          title: 'Sync generated tokens'
          body: |
            Regenerated from upstream [polkadot-app-design-system](https://github.com/${{ github.repository }}) at [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}).

            Files under `design-system/src/main/java/io/pcf/polkadotapp/designsystem/` are produced by `node build.js` in the upstream repo. Do not hand-edit — push to upstream `main` to regenerate.
          reviewers: foxwoosh
