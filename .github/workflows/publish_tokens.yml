name: Publish generated tokens

on:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - 'platforms/**'
      - 'lib/**'
      - 'build.js'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Generate platform output
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate
        run: node build.js

      - name: Upload iOS output
        uses: actions/upload-artifact@v7
        with:
          name: ios-generated
          path: out/ios/
          retention-days: 1
          if-no-files-found: error

      - name: Upload Android output
        uses: actions/upload-artifact@v7
        with:
          name: android-generated
          path: out/android/
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Open PR in ${{ matrix.repo }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: novasamatech/polkadot-app-design-system-ios
            token_repo: polkadot-app-design-system-ios
            artifact: ios-generated
            dest: Sources/DesignSystem/Generated
          - repo: novasamatech/polkadot-app-design-system-android
            token_repo: polkadot-app-design-system-android
            artifact: android-generated
            dest: design-system/src/main/java/io/pcf/polkadotapp/designsystem
    steps:
      - name: Checkout this repo (for the composite action)
        uses: actions/checkout@v6

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: novasamatech
          repositories: ${{ matrix.token_repo }}

      - name: Checkout target repo
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.repo }}
          token: ${{ steps.app-token.outputs.token }}
          path: target

      - name: Download generated artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: gen-out

      - name: Sync generated files
        run: |
          mkdir -p "target/${{ matrix.dest }}"
          rsync -a --delete gen-out/ "target/${{ matrix.dest }}/"

      - name: Create pull request
        uses: ./.github/actions/create-tokens-pr
        with:
          token: ${{ steps.app-token.outputs.token }}
          repo: ${{ matrix.repo }}
          working-directory: target
          branch: tokens/sync-${{ github.sha }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}
          commit-message: Sync generated tokens from polkadot-app-design-system@${{ github.sha }}
          title: Sync generated tokens
          body: |
            Regenerated from upstream [polkadot-app-design-system](https://github.com/${{ github.repository }}) at [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}).

            Files under `${{ matrix.dest }}/` are produced by `node build.js` in the upstream repo. Do not hand-edit — push to upstream `main` to regenerate.
